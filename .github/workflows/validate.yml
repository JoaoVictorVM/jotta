name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public repository
        run: python scripts/repository_check.py

      - name: Compile scripts
        run: python -m compileall -q scripts src

      - name: Install package
        run: python -m pip install ".[dev]"

      - name: Smoke test the CLI
        run: jotta --help

      - name: Run tests
        run: python -m pytest

      - name: Run harness doctor on the templates
        run: jotta --root src/jotta/templates doctor

      - name: Validate model routing
        run: jotta --root src/jotta/templates models validate

      - name: Check the packaged templates
        run: jotta --root "$(python -c 'from jotta.core.paths import templates_root; print(templates_root())')" doctor
