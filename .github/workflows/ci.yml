name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public repository
        run: python scripts/repository_check.py

      - name: Install development tools
        run: python -m pip install ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install development tools
        run: python -m pip install ".[dev]"

      - name: Mypy
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install ".[dev]"

      - name: Smoke test the CLI
        run: jotta --help

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml

      - name: Publish coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          {
            echo '## Coverage'
            echo
            echo '```text'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Run harness doctor on the templates
        run: jotta --root src/jotta/templates doctor

      - name: Validate model routing
        run: jotta --root src/jotta/templates models validate

      - name: Check the packaged templates
        run: jotta --root "$(python -c 'from jotta.core.paths import templates_root; print(templates_root())')" doctor
